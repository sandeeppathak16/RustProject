[package]
name = "expense_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
uuid = { version = "1", features = ["v4", "serde"] }
askama = "0.16.1"
diesel = { version = "2.0", features = ["r2d2", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
